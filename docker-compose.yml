version: "3"

services:
  redis:
    image: redis:7-alpine
    # appendonly yes：检查点与会话记录是唯一事实源，必须落盘（AOF）而不是只存在内存里
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    ports:
      - "8002:8002"
    volumes:
      - ./backend/data:/app/data
      - ./backend/config:/app/config
      - ./backend/prompts:/app/prompts
      - ./backend/logs:/app/logs
    environment:
      - NL2SQL_PORT=8002
      - NL2SQL_REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    restart: unless-stopped