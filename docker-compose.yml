version: "3"

services:
  redis:
    image: redis:8
    # Redis 8 内置 RedisJSON / RediSearch，官方 langgraph-checkpoint-redis 直接可用；
    # appendonly yes：检查点与会话记录是唯一事实源，必须落盘（AOF）而不是只存在内存里
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    ports:
      - "8002:8002"
    env_file:
      # LLM / MySQL 密钥与连接串（本机创建，不入库）以环境变量注入容器
      - ./backend/.env
    volumes:
      - ./backend/data:/app/data
      - ./backend/config:/app/config
      - ./backend/prompts:/app/prompts
      - ./backend/logs:/app/logs
    environment:
      - NL2SQL_PORT=8002
      - NL2SQL_REDIS_URL=redis://redis:6379/0
      # 生产由 frontend 的 nginx 托管静态资源与反代 /api，后端不再重复托管
      - NL2SQL_SERVE_FRONTEND=false
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    restart: unless-stopped